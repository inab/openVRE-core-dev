<VirtualHost *:80>
    ServerName ${SERVER_DOMAIN}

    DocumentRoot /var/www/html/openVRE/public/
    DirectoryIndex index.php

    <Directory "/var/www/html/openVRE/public/api">
        AllowOverride All
        Require all granted
    </Directory>

    # ==================================================
    # Apache -> Guacamole PoC
    # ==================================================

    ProxyPreserveHost On

    ProxyPass        /interactive-tool/guacamole/ http://guacamole:8080/guacamole/
    ProxyPassReverse /interactive-tool/guacamole/ http://guacamole:8080/guacamole/

    # ==================================================
    # Existing interactive tools
    # ==================================================

    RewriteEngine On

    # Do NOT send Guacamole through the old 8787 rule
    RewriteRule ^/interactive-tool/guacamole(/.*)?$ - [L]

    # Existing tool routing
    RewriteRule ^/interactive-tool/([^/]+)/?(.*) http://$1:8787/$2 [P,L]

    ErrorLog  /var/log/apache/vre-error.log
    CustomLog /var/log/apache/vre.log combined
</VirtualHost>
